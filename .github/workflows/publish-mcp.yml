name: Publish MCP Registry metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Blueprint-Studio-AI/claude-code-asset-generator' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check publication target
        run: |
          python3 - <<'PYTHON'
          import json
          with open('server.json') as manifest:
              server = json.load(manifest)
          assert server['name'] == 'io.github.Blueprint-Studio-AI/blueprint-studio'
          assert server['repository']['url'] == 'https://github.com/Blueprint-Studio-AI/claude-code-asset-generator'
          assert server['remotes'] == [{'type': 'streamable-http', 'url': 'https://tools.blueprintstudio.ai/api/mcp'}]
          PYTHON
      - name: Install verified official publisher
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output publisher.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  publisher.tar.gz' | sha256sum --check --strict
          tar xzf publisher.tar.gz mcp-publisher
      - name: Authenticate as this repository
        run: ./mcp-publisher login github-oidc
      - name: Publish committed metadata
        run: ./mcp-publisher publish server.json
